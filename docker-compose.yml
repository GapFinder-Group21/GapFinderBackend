services:

  db:
    image: postgis/postgis:16-3.5
    container_name: gapfinder-postgis

    environment:
      POSTGRES_USER: gapfinder
      POSTGRES_PASSWORD: gapfinder
      POSTGRES_DB: gapfinder

    ports:
      - "5432:5432"

    volumes:
      - gapfinder-postgis-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapfinder -d gapfinder"]
      interval: 5s
      timeout: 5s
      retries: 12


  pgadmin:
    image: dpage/pgadmin4
    container_name: gapfinder-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gapfinder.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      db:
        condition: service_healthy


  app:
    build: .
    container_name: gapfinder-app

    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gapfinder
      SPRING_DATASOURCE_USERNAME: gapfinder
      SPRING_DATASOURCE_PASSWORD: gapfinder
      # Values come from the .env file (not committed, see .env.example).
      # With the dummy defaults the backend starts, but the Google Calendar import does not work.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/google/callback}
      # The fallback is only for local development; production must set its own JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:-mF8k2LpQ9xVzT4wR7yN1sB6hJ3dK5gA0cE8uI2oW9qZ4tX7rY1nM6vP3lH5jS8x}

    ports:
      - "8080:8080"

    # Open table photos are kept outside the container so they survive restarts
    volumes:
      - gapfinder-uploads:/app/uploads


volumes:
  gapfinder-postgis-data:
  gapfinder-uploads: