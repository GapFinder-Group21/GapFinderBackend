services:

  db:
    image: postgis/postgis:16-3.5
    container_name: gapfinder-postgis

    environment:
      POSTGRES_USER: gapfinder
      POSTGRES_PASSWORD: gapfinder
      POSTGRES_DB: gapfinder

    ports:
      - "5432:5432"

    volumes:
      - gapfinder-postgis-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapfinder -d gapfinder"]
      interval: 5s
      timeout: 5s
      retries: 12


  pgadmin:
    image: dpage/pgadmin4
    container_name: gapfinder-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gapfinder.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      db:
        condition: service_healthy


  app:
    build: .
    container_name: gapfinder-app

    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gapfinder
      SPRING_DATASOURCE_USERNAME: gapfinder
      SPRING_DATASOURCE_PASSWORD: gapfinder
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

    ports:
      - "8080:8080"


volumes:
  gapfinder-postgis-data: